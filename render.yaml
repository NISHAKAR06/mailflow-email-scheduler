# Render Blueprint — Deploy Full MailFlow Stack (Frontend, Backend, Postgres, Redis)
services:
  # ── 1. Backend Service (Express + BullMQ Worker) ──
  - type: web
    name: mailflow-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: mailflow-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: mailflow-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: mailflow-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: MAX_EMAILS_PER_HOUR
        value: "100"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "50"
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: MIN_SEND_DELAY_MS
        value: "500"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: mailflow-frontend
          property: url

  # ── 2. Frontend Service (Next.js 14 Dashboard) ──
  - type: web
    name: mailflow-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: mailflow-frontend
          property: url
      - key: NEXTAUTH_SECRET
        fromService:
          type: web
          name: mailflow-backend
          property: envVar:JWT_SECRET
      - key: JWT_SECRET
        fromService:
          type: web
          name: mailflow-backend
          property: envVar:JWT_SECRET
      - key: INTERNAL_BACKEND_URL
        fromService:
          type: web
          name: mailflow-backend
          property: url
      - key: NEXT_PUBLIC_API_URL
        value: ""

# ── 3. Databases & Caching ──
databases:
  # Managed PostgreSQL Database
  - name: mailflow-postgres
    plan: free
    region: oregon
    databaseName: mailflow
    user: postgres

  # Managed Redis Instance (for BullMQ queues & rate limiters)
  - name: mailflow-redis
    plan: free
    region: oregon
    type: redis
